# data/rules/clerk_needs.yaml — WP2 (D-18; DOCUMENT_TAXONOMY §4 "CL" lines).
#
# Fixed English need lines that complete the clerk template "I need help with: {need line}."
# when the AI-proposed `clerk_need_en` fails the contact filter, the phrasing lint or the
# 200-character cap. Every value is ≤ 200 characters, grade ≤ 4, and contains no contacts.
# `other_notice` and `unknown` map to the pack key `clerk.generic_need` (rendered via `key:`).
version: "2026-09-27"
needs:
  uscis_receipt: "understanding a USCIS receipt notice and checking my case status"
