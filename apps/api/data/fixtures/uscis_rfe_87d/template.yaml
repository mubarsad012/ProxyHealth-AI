    translated_pages:
      - "دائرة خدمات الجنسية والهجرة الأمريكية\nوزارة الأمن الداخلي\nI-797E، إشعار إجراء\nتاريخ الإشعار: July 18, 2026\nرقم الإيصال: IOE0987654321\nطلب أدلة\nنحتاج أدلة أكثر قبل أن نتخذ قرارًا في نموذج I-485 الخاص بك.\nيجب أن تقدم الأدلة المطلوبة خلال 87 يومًا. يجب أن يصلنا ردك قبل October 13, 2026.\nيرجى تقديم الأدلة التالية:\n1. نسخة من شهادة ميلادك مع ترجمة معتمدة إلى الإنجليزية.\n2. صورتان بحجم جواز السفر التُقطتا خلال آخر 30 يومًا.\n3. نسخة من أحدث إقرار ضريبي فيدرالي لك.\nيرجى وضع هذا الإشعار فوق ردك.\nأرسل كل الأدلة معًا في طرد واحد.\nإذا لم ترد قبل التاريخ أعلاه، قد نعتبر قضيتك متروكة."
