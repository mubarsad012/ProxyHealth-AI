# data/safety/emergency.yaml — WP2 (D-14; COMPLIANCE_PRIVACY §7; AI_PROMPTS §11.7).
#
# Emergency lexicon run in code over transcripts, chat questions/messages and troubleshoot
# screen_text + user_goal. ANY hit → safety.emergency = true and the fixed emergency card first.
# Bias: over-trigger. A false positive costs one dismiss; a false negative may cost a life.
#
# Schema: {version, kinds, languages: {<tag>: {reviewed_by, reviewed_on, match, terms: {<kind>:
# [phrases]}, exclude: [phrases]}}}. Matching is case-insensitive after NFKC, quote/dash
# unification and removal of zero-width joiners. `match`:
#   word      — whole-word (Latin scripts); a term ending in `*` also matches longer words
#   prefix    — the term must start a word but may continue (inflecting non-Latin scripts)
#   substring — anywhere (scripts written without spaces between words: zh-Hans, zh-Hant, my,
#               and Korean, whose particles attach to the word)
# `proclitics` (optional, per language): one-letter prefixes written attached to the next word
# (Arabic و ف ب ل ك); up to two of them may stand before a term's first word, so "ولا أستطيع
# التنفس" ("and I cannot breathe") and "بألم في صدري" match their terms.
# `exclude` phrases (resource names printed on ordinary papers, e.g. "Poison Control", and label
# boilerplate such as "If swallowed") are removed from *printed* text (transcripts, screen_text)
# before matching so a medicine label's help line is not an emergency. They are never removed
# from what the user typed (chat question, troubleshoot user_goal): "My son swallowed something,
# should I call poison control?" is an emergency.
# Every list is a machine-assisted draft: `reviewed_by: null` until a native speaker signs off
# (launch gate, DECISIONS Q6). A language without a list falls back to en + es and adds
# warnings: [emergency_lexicon_unavailable].
