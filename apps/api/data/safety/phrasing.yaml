# data/safety/phrasing.yaml — WP2 (D-17; DOCUMENT_TAXONOMY §8). Schema: §8.6.
#
# Every model-authored sentence is linted per language (`en` always; a target language only when
# its section here is reviewed — `reviewed_by` set; otherwise English only plus the warning
# `phrasing_lint_unavailable`, §8.1). A section may carry its own `attribution_regex` (the §8.3
# exemption in that language), used on top of the English one. A hit triggers one
# `phrasing_rewrite` call; a second hit substitutes the family's fixed hedge
# (`hedge_key_by_family`, existing `chat.refusal.*` keys). Fixed copy never passes through the
# linter. Regexes are case-insensitive; `\b` boundaries are written explicitly.
version: "2026-10-22"
attribution_regex: "\\b(the|this|your|it) ?(paper|letter|notice|form|bill|summons|order|lease|label|court|judge|office|school|landlord|insurer|plan|irs|uscis|ice|social security)? ?(says|asks|lists|states|tells you|orders|warns)\\b"
# DOJ-accredited representatives practise immigration law only (before DHS/EOIR). The rewrite
# template's professional (below) uses the phrase for immigration papers and immigration-court
# types only; a traffic ticket, jury summons, wage claim or W-2 rewrite names a lawyer or a domain
# helper instead.
professional_by_category:
  immigration: "a licensed lawyer or a DOJ-accredited representative"
  court: "a licensed lawyer"
  civic: "a licensed lawyer"
  employment: "a licensed lawyer or a workers' rights office"
  medical: "your doctor, nurse or pharmacist"
  housing: "a housing lawyer or counselor"
  benefits: "the office that sent this paper"
  school: "the school office or a parent center"
  tax: "the IRS or a free tax helper"
  other: "a professional"
# Document types whose professional differs from their category's (court → immigration court).
professional_by_document_type:
  nta: "a licensed lawyer or a DOJ-accredited representative"
  hearing_notice: "a licensed lawyer or a DOJ-accredited representative"
  ij_decision: "a licensed lawyer or a DOJ-accredited representative"
  bia_notice: "a licensed lawyer or a DOJ-accredited representative"
  ice_checkin: "a licensed lawyer or a DOJ-accredited representative"
  w2_1099: "a free tax helper or a tax professional"
  itin: "the IRS or a free tax helper"
# Plan steps written by the model (TAXONOMY §8.4, `phrasing.fit_professional_step`). analyze.md
# Step 4 asks for "a licensed lawyer or a DOJ-accredited representative" on immigration, court,
# civic and employment papers, so a step naming an accredited representative is kept on those
# categories — unless the type's own professional above names none (w2_1099, itin). On any other
# paper (a medical bill, a lease, a tax or school notice) the whole step becomes the category's
# fixed `chat.refer.*` sentence. `accredited_rep_patterns` here apply in every language; each
# language section may add its own. "DOJ" counts only next to an accreditation word ("DOJ-
# accredited", "accredited by the DOJ", "acreditado por el DOJ"): a step that names the DOJ as an
# agency ("The DOJ and the IRS never ask for gift cards.") names no representative.
accredited_rep_categories: [immigration, court, civic, employment]
accredited_rep_patterns:
  - "\\bDOJ\\W{0,2}(accredit|rep\\b|representative)"
  - "\\bac{1,2}redit\\w*(\\W+\\w+){0,3}?\\W+DOJ\\b"
# The prompt's example opener copied onto a step that points at no demand ("Before that date,
# talk to …"): the opener is removed and nothing is put in its place (no date is ever added).
copied_step_openers:
  - "^\\s*(before that date|antes de esa fecha)\\s*,\\s*"
refer_to_by_category:
  immigration: lawyer_or_accredited_rep
  court: lawyer_or_accredited_rep
  civic: lawyer_or_accredited_rep
  employment: lawyer_or_accredited_rep
  medical: clinician
  housing: housing_counselor
  benefits: benefits_office
  school: sender
  tax: sender
  other: sender
# TAXONOMY §6.4: on a paper scored `possible` or `likely` scam nothing may send the reader back to
# the paper's own contact (the scam card says "check with the real office"). For such a paper these
# override the referral above ("Ask the sender …", "The office that sent this paper …") and the
# rewrite template's professional ("the office that sent this paper"); the lawyer referral points
# to Get help, which the scam score already reorders (scam_report first).
scam_refer_to_by_category:
  benefits: lawyer_or_accredited_rep
  school: lawyer_or_accredited_rep
  tax: lawyer_or_accredited_rep
  other: lawyer_or_accredited_rep
scam_professional_by_category:
  benefits: "a licensed lawyer"
hedge_key_by_family:
  eligibility: chat.refusal.eligibility
  outcome: chat.refusal.outcome
  advice_verb: chat.refusal.filing_advice
  negated_duty: chat.refusal.filing_advice
  medical_interpret: chat.refusal.medical_interpretation
  legal_status: chat.refusal.filing_advice
  benefits_decision: chat.refusal.eligibility
  housing_law: chat.refusal.filing_advice
  tax_work_conclusion: chat.refusal.filing_advice
  school_decision: chat.refusal.eligibility
  contact_like: chat.refusal.contact_request
  skip_duty: chat.refusal.filing_advice
  skip_duty_conditional: chat.refusal.filing_advice
  dramatize: null
# Words that mark a `professional` plan step as already naming a professional (§8.4). English is
# always checked; a language section's own `professional_words` are checked on top (word starts
# for Latin-script words, anywhere in the text for other scripts, where prefixes attach).
professional_words:
  - lawyer
  - attorney
  - representative
  - doctor
  - nurse
  - pharmacist
  - clinician
  - counselor
  - counsellor
  - office
  - helper
  - advocate
  - navigator
  - clinic
  - center
  - centre
  - agency
  - hotline
  - helpline
  - professional
  - preparer
  - tax help
  - tax-help
  - vita
# Per language: `title_connectors` are the dangling words `summary_text.repair_title` drops from
# the end of a summary title the schema cap cut off ("… so they can send your Medicaid and").
languages:
  en:
    reviewed_by: null
    accredited_rep_patterns:
      - "\\baccredited representative"
    title_connectors: [and, or, to, the, a, an, of, for, by, about, so, your, with, from, in, "on", at, that, asking, you, they, can]  # "on" quoted: bare, YAML reads it as true
    families:
      - id: eligibility
        domains: [all]
        skip_when_attributed: false
        patterns:
          - "\\byou(?:'re| are|'re not| are not| aren't) (probably |likely |definitely |clearly |not )?(eligible|ineligible|entitled)\\b"
          - "\\byou (do|don't|do not) (probably |likely )?qualify\\b"
          - "\\byou (probably |likely |should |may |might |will |would |definitely )?qualify\\b"
          - "\\byour (child|children|family|husband|wife|son|daughter) (qualif(y|ies)|is eligible|are eligible|will get|won't get)\\b"
          - "\\byou (will|won't|will not|can|cannot|can't) (get|receive|keep|lose) (your )?(benefits|coverage|medicaid|snap|wic|ssi|asylum|a green card|your permit)\\b"
      - id: outcome
        domains: [all]
        skip_when_attributed: false
        patterns:
          - "\\byou (will|won't|will not|would|are going to|are likely to|are unlikely to) (probably |likely |definitely |almost certainly )?(win|lose|be (approved|denied|deported|removed|evicted|arrested|fined))\\b"
          - "\\byour (case|appeal|application) (will|is likely to|should) (be )?(approved|denied|succeed|fail|win|lose)\\b"
          - "\\byou have (a strong|a weak|no|a good) (case|chance)\\b"
          - "\\bnothing (will happen|to worry about)\\b"
          - "\\b(don't|do not) worry\\b"
          - "\\byou('ll| will) be (fine|okay|ok)\\b"
      - id: advice_verb
        domains: [all]
        skip_when_attributed: true
        patterns:
          - "\\byou (should|must|need to|have to|ought to|had better|are required to) (file|appeal|apply|pay|sign|send|submit|plead|accept|refuse|leave|move( out)?|stop|start|take|register|check the box)\\b"
      - id: negated_duty
        domains: [all]
        skip_when_attributed: true
        patterns:
          - "\\byou (do not|don't|never|won't|will not) (have|need) to\\b"
          - "\\byou need not\\b"
          - "\\b(there is |there's )?no need to (go|attend|appear|answer|respond|reply|pay|show up|come)\\b"
          - "\\b(does not|doesn't) require you to\\b"
          - "\\byou (can|may) (ignore|skip|throw away)\\b"
          - "\\bthis means (that )?you (have|owe|must|are|will|can|cannot)\\b"
      # Telling the reader not to go to court, a hearing, an interview or an appointment ("If the
      # paper says it is a sample, do not pay or go to court."): never model advice, attributed or
      # not. Only the imperative is caught: "if you do not show up for court, …" (a consequence)
      # and "Do not pay and do not call the number on this letter." are not. Nor is a qualifier
      # later in the sentence ("Do not go to court without your ID.", "… late."), which is good
      # advice; a condition ("… if you have a fever") goes to `skip_duty_conditional` below.
      - id: skip_duty
        domains: [all]
        skip_when_attributed: false
        patterns:
          - "(?<!\\byou )(?<!\\bthey )(?<!\\bwe )(?<!\\bi )\\b(do not|don't|never)\\s+(\\w+\\s+or\\s+)?(go|come|show up|appear|attend)\\b(\\W+\\w+){0,3}?\\W+(court|hearing|interview|appointment)s?\\b(?![^.;!?]*\\b(without|late|if|unless|when|while)\\b)"
          - "^(please\\s+)?(skip|ignore)\\s+(the\\s+|your\\s+|this\\s+)?(\\w+\\s+)?(court|hearing|interview|appointment)s?\\b(?![^.;!?]*\\b(without|late|if|unless|when|while)\\b)"
      # The same imperative with a condition after it ("Do not come to court if you have a fever;
      # call the clerk.") is a jury summons' or a clinic's own printed instruction when attributed
      # ("The court says …"), so attribution exempts it; unattributed it is model advice.
      - id: skip_duty_conditional
        domains: [all]
        skip_when_attributed: true
        patterns:
          - "(?<!\\byou )(?<!\\bthey )(?<!\\bwe )(?<!\\bi )\\b(do not|don't|never)\\s+(\\w+\\s+or\\s+)?(go|come|show up|appear|attend)\\b(\\W+\\w+){0,3}?\\W+(court|hearing|interview|appointment)s?\\b(?![^.;!?]*\\b(without|late)\\b)(?=[^.;!?]*\\b(if|unless|when|while)\\b)"
      - id: dramatize
        domains: [all]
        skip_when_attributed: false
        patterns:
          - "\\byou (may|might|could|will) be deported\\b"
          - "(?-i:\\b(URGENT|WARNING|IMMEDIATELY)\\b)"
          - "!"
          - "\\b(catastroph\\w*|disaster|ruin\\w*)\\b"
      - id: medical_interpret
        domains: [medical]
        skip_when_attributed: false
        patterns:
          # "you have <condition>" (D-17 diagnosis), not "you have an appointment / questions /
          # 30 days / to pay / them" nor a sentence-final "the papers you have".
          - "\\byou (have|might have|may have|could have|probably have|likely have)\\s+(?!\\d|(to|got|gotten|been|had|done|made|given|taken|told|received|paid|missed|filed|sent|used|reached|met|signed|submitted|returned|completed|applied|asked|requested|scheduled|chosen|called|moved|changed|already|until|till|through|up to|one|two|three|four|five|six|seven|eight|nine|ten|fourteen|fifteen|twenty|thirty|sixty|ninety|any|some|questions?|concerns?|them|it|this|that|these|those|time|days?|weeks?|months?|years?|insurance|coverage|medicaid|medicare|children|kids|an? (appointment|question|concern|bill|balance|copay|co-pay|payment|hearing|meeting|visit|interview|right|choice|option|account|deadline|refill|prescription|referral|insurance|plan|card|form|letter|few|week|month|day|year|child|doctor|provider)s?|the (right|option|choice|form|letter|paper|card|bill|appointment)s?|your (appointment|card|form|letter|paper|papers|bill|insurance|id))\\b)\\w"
          - "\\byou are (suffering from|diabetic|anemic|pregnant|infected|allergic|contagious)\\b"
          - "\\b(your|the) (\\w+ ){0,2}(results?|levels?|values?|numbers?|readings?) (are|is|show|shows|mean|means|indicate|suggests?) (normal|abnormal|high|low|fine|good|bad|healthy|dangerous|too (high|low)|that)\\b"
          - "\\b(is a sign of|means you have|points to) \\w+"
          - "\\byou (need|should|must|can|may) (take|stop|skip|double|increase|decrease|reduce|mix) (the|your|this) (dose|medicine|medication|pill|tablet)\\b"
          - "\\byou (need to|should|must|can|could|may) (stop|quit|skip|double|increase|decrease|reduce|mix)( taking| using)? (the |your |this |that |these )?(\\w+ )?(dose|doses|medicine|medicines|medication|medications|pills?|tablets?|drugs?|insulin|antibiotics?)\\b"
          - "\\bit is (safe|not safe|okay|fine) to (take|stop|mix|drink|drive)\\b"
          - "\\byour (?!balance|bill|amount|payment|copay|deductible|premium|rent|appointment)\\w+ (level |levels |count |reading )?(is|are) (too |very |a little )?(high|low|abnormal|normal|elevated|dangerous|fine|healthy)\\b"
          # two-word analytes ("your blood sugar is too high") and a value in between ("your
          # cholesterol is 260, which is high"; "your A1C of 9.1 is above normal")
          - "\\byour (?!(\\w+ ){0,2}(balance|bill|amount|payment|copay|deductible|premium|rent|appointment|cost|charges?|total|price|fee)\\b)(\\w+ ){1,3}(is|are) (too |very |a little |slightly )?(high|low|abnormal|normal|elevated|dangerous|healthy)\\b"
          - "\\byour (?!(\\w+ ){0,2}(balance|bill|amount|payment|copay|deductible|premium|rent|cost|charges?|total|price|fee)\\b)(\\w+ ){1,3}(is|are|of|at) [\\d.,]+[^.;]{0,40}\\b(high|low|abnormal|normal|elevated|dangerous|healthy)\\b"
          - "\\b(is|are|was|were) (above|below|outside|out of) (the )?(normal|healthy|target|reference) ?(range|limits?|levels?)?\\b"
          - "\\b(of|at) [\\d.,]+ (means|shows|indicates|suggests|is a sign of)\\b"
          - "\\b(which |that |this )?(can|could|may|might) be (dangerous|serious|life-threatening)\\b"
        medical_words: "\\b(dose|medicine|medication|pill|tablet|test|results?|levels?|mg|ml|diagnos\\w*|prescription|lab)\\b"
      - id: legal_status
        domains: [immigration, court, civic, employment]
        skip_when_attributed: true
        patterns:
          - "\\byou (are|are not|aren't) (deportable|removable|in status|out of status|undocumented|legal|illegal|authorized to work|allowed to work|allowed to travel)\\b"
          - "\\byou (can|cannot|can't|may|may not) (work|stay|travel|be deported|be removed|vote)\\b"
          - "\\b(plead|you should plead) (guilty|not guilty)\\b"
          - "\\bcheck (the box|'citizen')\\b"
          - "^(file|submit) (form \\w+|an appeal|a motion)\\b"
      - id: benefits_decision
        domains: [benefits, medical]
        skip_when_attributed: true
        patterns:
          - "\\byour (benefits|coverage|case|food stamps) (will|won't|will not) (end|stop|be cut|continue|be approved|be renewed)\\b"
          - "\\byou (are|aren't|are not) (over|under) the (income )?limit\\b"
          - "\\byou (do|don't|do not) count\\b"
          - "\\byou (will|won't) (get|receive) (snap|wic|medicaid|ssi|a check|back pay)\\b"
      - id: housing_law
        domains: [housing]
        skip_when_attributed: true
        patterns:
          - "\\byou (have to|must|need to|do not have to|don't have to|can|cannot|can't) (leave|move out|stay|be evicted|pay (the|this) (fee|increase))\\b"
          - "\\bthe landlord (can|cannot|can't|has to|must|is allowed to|is not allowed to)\\b"
          - "\\b(illegal|unlawful|legal|valid|invalid) (eviction|notice|increase|fee|lease)\\b"
          - "\\bwithin \\d+ days you (must|have to)\\b"
      - id: tax_work_conclusion
        domains: [tax, employment]
        skip_when_attributed: true
        patterns:
          - "\\byou (owe|don't owe|do not owe|will get a refund|are owed)\\b"
          - "\\byou (should|must) (agree|disagree|sign|pay the irs)\\b"
          - "\\b(this is|it is|that is) (wage theft|illegal|discrimination|retaliation|fraud)\\b"
          - "\\byou (can|cannot|can't) (be fired|sue|be paid less)\\b"
          - "\\byou were (underpaid|cheated|not paid enough)\\b"
      - id: school_decision
        domains: [school]
        skip_when_attributed: true
        patterns:
          - "\\byour child (needs|does not need|doesn't need|qualifies for|is eligible for|should be in|must be in) (special education|an iep|a 504|services|this school)\\b"
          - "\\bthe school (must|cannot|can't|has to) (enroll|exclude|test|evaluate)\\b"
  es:
    reviewed_by: null
    # "La carta dice …", "Su arrendador, Oak Hollow LLC, dice que …" (an appositive may sit
    # between the noun and the verb).
    attribution_regex: "\\b(el|la|este|esta|su) (papel|carta|aviso|formulario|factura|citaci[oó]n|orden|contrato|etiqueta|corte|juez|oficina|escuela|arrendador|aseguradora|plan)?(, [^,.;]{1,80},)? ?(dice|pide|indica|establece|ordena|advierte)\\b"
    professional_words: [abogad, representante, consejer, asesor, médic, enfermer, farmac, oficina, clínica, centro, agencia, defensor, profesional, preparador]
    accredited_rep_patterns:
      - "\\brepresentante acreditado"
    title_connectors: [y, o, a, el, la, los, las, un, una, de, del, al, para, por, sobre, su, sus, con, en, que, le, se]
    families:
      - id: eligibility
        domains: [all]
        skip_when_attributed: false
        patterns:
          - "\\b(usted )?(es|no es) elegible\\b"
          - "\\b(usted )?(no )?califica\\b"
          - "\\btiene(s)? derecho a\\b"
      - id: outcome
        domains: [all]
        skip_when_attributed: false
        patterns:
          - "\\b(usted )?(va a|no va a) (ganar|perder|ser (aprobad|negad|deportad|desalojad)[oa])\\b"
          - "\\bno se preocupe\\b"
          - "\\bsu caso (ser[aá]|va a ser) (aprobado|negado)\\b"
      - id: advice_verb
        domains: [all]
        skip_when_attributed: true
        patterns:
          - "\\b(usted )?(debe|tiene que|necesita|deber[ií]a) (presentar|apelar|solicitar|pagar|firmar|enviar|mudarse|irse|declararse)\\b"
      - id: negated_duty
        domains: [all]
        skip_when_attributed: true
        patterns:
          - "\\b(usted )?no tiene que\\b"
          - "\\besto significa que (usted )?(tiene|debe|puede|va a)\\b"
      - id: medical_interpret
        domains: [medical]
        skip_when_attributed: false
        patterns:
          - "\\b(usted )?(tiene|padece|sufre de) (diabetes|anemia|una infecci[oó]n|c[aá]ncer)\\b"
          - "\\bsus (resultados|niveles|valores) (son|est[aá]n|indican|muestran) (normales|anormales|altos|bajos|peligrosos)\\b"
  # ar / prs / ps: no reviewed lint families yet (CL-073), so these sections only name who a
  # professional step may point to (§8.4) and the title connectors. A section without families
  # is never linted, even when `reviewed_by` is set.
  ar:
    reviewed_by: null
    professional_words: [محام, ممثل, مستشار, طبيب, ممرض, صيدل, مكتب, عيادة, مركز]
    accredited_rep_patterns:
      - "ممثل\\S* معتمد"
      - "وزارة العدل"
    title_connectors: [و, أو, في, من, إلى, على, عن, مع, أن, التي, الذي]
  prs:
    reviewed_by: null
    professional_words: [وکیل, نماینده, مشاور, داکتر, نرس, دواساز, دفتر, کلینیک, مرکز]
    accredited_rep_patterns:
      - "نماینده\\S* تأییدشده"
      - "وزارت عدلیه"
    title_connectors: [و, یا, در, از, به, برای, با, که, را, این, تا]
  ps:
    reviewed_by: null
    professional_words: [وکیل, استازی, سلاکار, ډاکټر, دفتر]
    title_connectors: [او, یا, په, له, د, ته, سره, چې]
